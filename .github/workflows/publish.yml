name: Publish versioned containers
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - id: release
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run build
      - run: npm test
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
  images:
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: app
            arch: amd64
            runner: ubuntu-24.04
            dockerfile: Dockerfile
          - component: app
            arch: arm64
            runner: ubuntu-24.04-arm
            dockerfile: Dockerfile
          - component: cpu
            arch: amd64
            runner: ubuntu-24.04
            dockerfile: docker/whisper.cpu.Dockerfile
          - component: cpu
            arch: arm64
            runner: ubuntu-24.04-arm
            dockerfile: docker/whisper.cpu.Dockerfile
          - component: vulkan
            arch: amd64
            runner: ubuntu-24.04
            dockerfile: docker/whisper.Dockerfile
          - component: cuda
            arch: amd64
            runner: ubuntu-24.04
            dockerfile: docker/whisper.cuda.Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Identify image
        id: image
        env:
          BASE: ${{ needs.verify.outputs.image }}
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="$BASE"
          if [ "$COMPONENT" != app ]; then image="$image-whisper"; fi
          echo "tag=$image:build-$GITHUB_SHA-$COMPONENT-$ARCH" >> "$GITHUB_OUTPUT"
      - name: Build for this native architecture
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}
      - name: Smoke check
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          COMPONENT: ${{ matrix.component }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: sh scripts/smoke-image.sh
      - name: Push checked architecture image
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker push "$IMAGE"
          mkdir -p image-digests
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' > "image-digests/$COMPONENT-$ARCH.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-${{ matrix.component }}-${{ matrix.arch }}
          path: image-digests/*.txt
          retention-days: 7
  manifests:
    needs: [verify, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: image-*
          merge-multiple: true
          path: image-digests
      - name: Publish complete version tags
        env:
          BASE: ${{ needs.verify.outputs.image }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          docker buildx imagetools create -t "$BASE:$VERSION" "$(cat image-digests/app-amd64.txt)" "$(cat image-digests/app-arm64.txt)"
          docker buildx imagetools create -t "$BASE-whisper:$VERSION-cpu" "$(cat image-digests/cpu-amd64.txt)" "$(cat image-digests/cpu-arm64.txt)"
          docker buildx imagetools create -t "$BASE-whisper:$VERSION-vulkan" "$(cat image-digests/vulkan-amd64.txt)"
          docker buildx imagetools create -t "$BASE-whisper:$VERSION-cuda" "$(cat image-digests/cuda-amd64.txt)"
  all-in-one:
    needs: [verify, manifests]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/all-in-one.yml
    with:
      publish: true
      tag_prefix: ${{ needs.verify.outputs.version }}
      worker_version: ${{ needs.verify.outputs.version }}
  release:
    needs: [verify, manifests, all-in-one]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Make installation bundle
        run: python3 scripts/release-bundle.py
      - name: Publish release downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "$VERSION" release/* --verify-tag --prerelease --title "Margin $VERSION" --notes-file docs/RELEASE.md
