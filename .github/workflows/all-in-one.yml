name: Build all-in-one containers
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      tag_prefix:
        type: string
        default: preview
      worker_version:
        type: string
        default: v0.1.5
concurrency:
  group: all-in-one-${{ inputs.tag_prefix }}-${{ inputs.publish }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cpu
            arch: amd64
            runner: ubuntu-24.04
          - backend: cpu
            arch: arm64
            runner: ubuntu-24.04-arm
          - backend: vulkan
            arch: amd64
            runner: ubuntu-24.04
          - backend: cuda
            arch: amd64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - id: image
        env:
          BACKEND: ${{ matrix.backend }}
          ARCH: ${{ matrix.arch }}
          WORKER_VERSION: ${{ inputs.worker_version }}
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tag=$base:build-$GITHUB_SHA-aio-$BACKEND-$ARCH" >> "$GITHUB_OUTPUT"
          echo "worker=$base-whisper:$WORKER_VERSION-$BACKEND" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/all-in-one.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: WORKER_IMAGE=${{ steps.image.outputs.worker }}
          load: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Margin with built-in Whisper transcription (${{ matrix.backend }})
          cache-from: type=gha,scope=aio-${{ matrix.backend }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=aio-${{ matrix.backend }}-${{ matrix.arch }}
      - name: Verify the built container
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          BACKEND: ${{ matrix.backend }}
        run: sh scripts/smoke-all-in-one.sh
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified architecture
        if: inputs.publish
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          BACKEND: ${{ matrix.backend }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker push "$IMAGE"
          mkdir -p aio-digests
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' > "aio-digests/$BACKEND-$ARCH.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.publish
        with:
          name: aio-${{ matrix.backend }}-${{ matrix.arch }}
          path: aio-digests/*.txt
          retention-days: 7
  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: aio-*
          merge-multiple: true
          path: aio-digests
      - name: Publish all hardware tags only after every check passes
        env:
          PREFIX: ${{ inputs.tag_prefix }}
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          for backend in cpu vulkan cuda; do
            sources=("$(cat "aio-digests/$backend-amd64.txt")")
            if [ "$backend" = cpu ]; then sources+=("$(cat aio-digests/cpu-arm64.txt)"); fi
            docker buildx imagetools create -t "$base:sha-$GITHUB_SHA-aio-$backend" -t "$base:$PREFIX-aio-$backend" "${sources[@]}"
          done
